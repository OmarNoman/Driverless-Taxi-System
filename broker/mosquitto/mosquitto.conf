# Week 4 - local development MQTT broker (Eclipse Mosquitto 2.x).
#
# Local dev only: a single plain-text listener on 1883 with anonymous access. TLS,
# authentication and a public-facing endpoint are Week 8 (AWS) concerns, not this.

listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type notice
log_type warning
log_type error
