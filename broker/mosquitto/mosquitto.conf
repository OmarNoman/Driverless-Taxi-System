# Week 4 - local development MQTT broker (Eclipse Mosquitto 2.x).
#
# Local dev only: a single plain-text listener on 1883 with anonymous access. AWS
# (Week 8) runs the same plain-text/anonymous config, written inline by the ECS task
# definition rather than from this file (Fargate has no bind mounts) - see
# terraform/ecs.tf's mosquitto container command. TLS/auth on the public 1883 listener
# is an explicitly-deferred gap, not silently dropped: neither the Week 8 Project Plan
# line nor the Implementation Plan paragraph mentions broker security, only CloudWatch/
# auto-scaling, so it stayed out of scope rather than being guessed at.

listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type notice
log_type warning
log_type error
